<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinepisode — Titres détectés</title>
<link rel="stylesheet" href="import.css">
</head>
<body>
  <!-- Page « Titres détectés » de l'extension : tout ce qui est lu ici (historique Netflix, fichier CSV,
       détections en direct) reste dans ce navigateur. Rien n'est envoyé à Cinepisode avant « Appliquer ». -->
  <header class="top">
    <div class="logo"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7"/><path d="M9 7.3 17 12 9 16.7z"/></svg><span class="logo-word">cin<em>episode</em></span></div>
    <h1 data-t="pageTitle"></h1>
  </header>

  <main>
    <section class="panel" id="sources">
      <p class="intro" data-t="intro"></p>
      <div class="actions">
        <button id="importNetflix" class="primary" data-t="importNetflix"></button>
        <label class="button secondary" for="csvFile"><span data-t="importCsv"></span></label>
        <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
      </div>
      <p class="hint" data-t="csvHint"></p>
      <div id="progress" class="progress" hidden>
        <div class="bar"><div id="progressBar"></div></div>
        <div id="progressText" aria-live="polite"></div>
      </div>
      <div id="message" class="message" hidden aria-live="polite"></div>
      <p class="meta" id="lastImport"></p>
    </section>

    <section class="panel" id="detected">
      <div class="filters" role="tablist" id="filters"></div>
      <div class="bulk">
        <label class="check"><input type="checkbox" id="selectAll"> <span data-t="selectAll"></span></label>
        <span class="spacer"></span>
        <button id="ignoreSelected" class="ghost" data-t="ignoreSelected"></button>
        <button id="apply" class="primary" disabled></button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </section>

    <p class="privacy" data-t="privacy"></p>
  </main>

  <script src="lib/import.js"></script>
  <script src="import-page.js"></script>
</body>
</html>
