<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cinepisode</title>
<style>
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0a0c;color:#e8e8ec;width:360px;padding:18px;margin:0}
  h1{font-size:14px;margin:0 0 4px}
  p{font-size:12px;color:#9a9aa5;line-height:1.5;margin:0 0 14px}
  label{display:block;font-size:11px;color:#9a9aa5;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;background:#17171c;border:1px solid #2a2a33;border-radius:8px;color:#e8e8ec;padding:8px 10px;font-family:monospace;font-size:12px}
  button{margin-top:10px;width:100%;background:#2a66ff;border:none;border-radius:8px;color:#fff;padding:9px;font-size:13px;cursor:pointer}
  button:hover{background:#3b74ff}
  a{color:#5ac8fa;font-size:12px}
  #status{margin-top:10px;font-size:12px}
  #status.ok{color:#4ade80}
  #status.err{color:#ff7070}
  h2{font-size:12px;margin:16px 0 6px;color:#e8e8ec}
  #last{font-size:12px;line-height:1.5;background:#17171c;border:1px solid #2a2a33;border-radius:8px;padding:8px 10px}
  #last .when{display:block;color:#9a9aa5;font-size:11px;margin-top:2px}
  #last.ok{border-color:#1f5f3a}
  #last.warn{border-color:#6b5414}
  #last.err{border-color:#6b2020}
  button.secondary{background:#17171c;border:1px solid #2a2a33;color:#e8e8ec;margin-top:0}
  button.secondary:hover{background:#1e1e23}
  .filebtn{display:block;margin-top:8px;text-align:center;background:#17171c;border:1px solid #2a2a33;border-radius:8px;color:#e8e8ec;padding:9px;font-size:13px;cursor:pointer}
  .filebtn:hover{background:#1e1e23}
  .filebtn.disabled{opacity:.5;pointer-events:none}
  .hint{font-size:11px;margin:6px 0 0}
  #importStatus{margin-top:10px;font-size:12px;line-height:1.5;background:#17171c;border:1px solid #2a2a33;border-radius:8px;padding:8px 10px}
  #importStatus:empty{display:none}
  #importStatus.ok{border-color:#1f5f3a}
  #importStatus.err{border-color:#6b2020;color:#ff9a9a}
  #importStatus .diag{display:block;margin-top:8px;font-size:12px;padding:5px 10px;width:auto}
  .bar{height:4px;background:#2a2a33;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar>span{display:block;height:100%;background:#2a66ff;width:0;transition:width .3s}
  #openDetected{margin-top:8px}
  button:disabled{opacity:.5;cursor:default}
  p.spaced{margin-top:14px}
  .platform{margin-top:12px;padding:10px;background:#111115;border:1px solid #2a2a33;border-left:3px solid #2a2a33;border-radius:8px}
  .platform[data-platform="crunchyroll"]{border-left-color:#f47521}
  .platform[data-platform="prime"]{border-left-color:#00a8e1}
  .platform h3{font-size:12px;margin:0;display:flex;justify-content:space-between;align-items:center}
  .platform .state{font-size:11px;color:#4ade80;margin:6px 0 0}
  .platform .state.err{color:#ff9a9a}
  .platform .state:empty{display:none}
  .platform [data-role="enable"]{border:1px solid currentColor}
  .platform[data-platform="crunchyroll"] [data-role="enable"]{color:#f47521}
  .platform[data-platform="prime"] [data-role="enable"]{color:#00a8e1}
  .platform [data-role="enable"]:hover{background:#1e1e23}
  button.link{width:auto;margin:0;padding:0;background:none;border:none;color:#9a9aa5;font-size:11px;text-decoration:underline}
  button.link:hover{background:none;color:#e8e8ec}
  /* Bande de statut des 3 plateformes (clarté d'un coup d'oeil) */
  .platsum-title{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#6a6a74;margin:0 0 6px}
  .platsum{display:flex;gap:6px;margin-bottom:16px}
  .platsum-chip{flex:1;display:flex;align-items:center;gap:6px;padding:7px 8px;background:#111115;border:1px solid #2a2a33;border-radius:8px;font-size:11px;min-width:0}
  .platsum-dot{width:7px;height:7px;border-radius:50%;background:#4a4a54;flex-shrink:0}
  .platsum-dot.on{background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.18)}
  .platsum-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .platsum-sub{color:#6a6a74;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .platsum-chip[data-chip="netflix"]{border-left:3px solid #e50914}
  .platsum-chip[data-chip="crunchyroll"]{border-left:3px solid #f47521}
  .platsum-chip[data-chip="prime"]{border-left:3px solid #00a8e1}
</style>
</head>
<body>
  <!-- Textes : _locales/<langue>/messages.json (langue du navigateur, anglais par défaut) -->
  <h1 data-msg="optionsTitle">Cinepisode</h1>
  <p class="platsum-title" data-msg="platformsSummaryTitle"></p>
  <div class="platsum" id="platsum">
    <div class="platsum-chip" data-chip="netflix">
      <span class="platsum-dot on"></span>
      <div><span class="platsum-name">Netflix</span><br><span class="platsum-sub" data-msg="platformNetflixAlways"></span></div>
    </div>
    <div class="platsum-chip" data-chip="crunchyroll">
      <span class="platsum-dot" data-role="dot"></span>
      <div><span class="platsum-name">Crunchyroll</span><br><span class="platsum-sub" data-role="sub"></span></div>
    </div>
    <div class="platsum-chip" data-chip="prime">
      <span class="platsum-dot" data-role="dot"></span>
      <div><span class="platsum-name">Prime Video</span><br><span class="platsum-sub" data-role="sub"></span></div>
    </div>
  </div>
  <p data-msg="optionsIntro"></p>
  <label for="token" data-msg="tokenLabel"></label>
  <input type="text" id="token" placeholder="a1b2c3...">
  <button id="save" data-msg="save"></button>
  <div id="status"></div>
  <h2 data-msg="lastTitle"></h2>
  <div id="last" aria-live="polite"></div>
  <h2 data-msg="historyTitle"></h2>
  <p data-msg="historyIntro"></p>
  <button id="importNetflix" class="secondary" data-msg="importNetflix"></button>
  <label id="csvLabel" class="filebtn" for="csvFile"><span data-msg="importCsv"></span></label>
  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <p class="hint" data-msg="importCsvHint"></p>
  <h2 data-msg="platformsTitle"></h2>
  <p data-msg="platformsIntro"></p>
  <div class="platform" data-platform="crunchyroll">
    <h3><span>Crunchyroll</span><button class="link" data-role="disable" data-msg="disablePlatform" hidden></button></h3>
    <button class="secondary" data-role="enable" data-msg="enableCrunchyroll"></button>
    <button class="secondary" data-role="import" data-msg="importCrunchyroll" hidden></button>
    <p class="state" data-role="state"></p>
    <p class="hint" data-msg="crunchyrollHint"></p>
  </div>
  <div class="platform" data-platform="prime">
    <h3><span>Prime Video</span><button class="link" data-role="disable" data-msg="disablePlatform" hidden></button></h3>
    <button class="secondary" data-role="enable" data-msg="enablePrime"></button>
    <button class="secondary" data-role="import" data-msg="importPrime" hidden></button>
    <p class="state" data-role="state"></p>
    <p class="hint" data-msg="primeHint"></p>
  </div>
  <div id="importStatus" aria-live="polite"></div>
  <button id="openDetected" class="secondary" data-msg="openDetected"></button>
  <p class="spaced" data-msg="coverage"></p>
  <a href="https://cinepisode.com" target="_blank" rel="noopener" data-msg="openApp"></a>
  <script src="lib/platforms.js"></script>
  <script src="options.js"></script>
</body>
</html>
