<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>Cinepisode</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<!-- Fenêtre de l'extension 0.8.2 (appairage en un clic depuis le site). Textes : _locales/<langue>/messages.json (langue du navigateur, anglais par défaut).
     Trois états (non connecté, connecté au repos, détection en cours) et la vue Réglages, qui glisse depuis la droite. -->
<div class="stage" id="stage">

  <!-- ÉTAT 1 : non connecté (ou changement de jeton) -->
  <section class="view" id="viewOff" hidden>
    <div class="hd rise"><a class="logo" href="https://cinepisode.com" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="12" width="4" height="7" rx="2" fill="var(--text3)"/><rect x="10" y="8.5" width="4" height="10.5" rx="2" fill="#888"/><rect x="16.5" y="4" width="4" height="14" rx="2" fill="var(--accent2)"/></svg><span>cin<em>episode</em></span></a><span class="conn"><i class="dot off"></i><span data-msg="notConnected"></span></span></div>
    <div class="sec rise" style="--d:1"><div class="card"><div class="hero"><div class="lg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z" fill="currentColor"/></svg></div>
      <h2 data-msg="offHeroTitle"></h2><p data-msg="offHeroSub"></p></div></div></div>
    <div class="sec rise" style="--d:2">
      <button type="button" class="btn pri pair" id="pairBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span data-msg="pairButton"></span></button>
      <p class="pair-sub" data-msg="pairSub"></p>
      <details class="manual" id="manualBox"><summary data-msg="manualToggle"></summary>
      <ol class="steps"><li data-msg="offStep1"></li><li data-msg="offStep2"></li><li data-msg="offStep3"></li></ol>
      <input class="inp" type="text" id="token" autocomplete="off" spellcheck="false" data-ph-msg="tokenPlaceholder" data-aria-msg="tokenLabel">
      <button type="button" class="btn" id="save" data-msg="connect"></button>
      </details>
      <div id="status" aria-live="polite"></div>
      <p class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-msg="offPrivacy"></span></p>
    </div>
    <div class="ft rise" style="--d:3"><span id="offFootText" data-msg="noAccount"></span><a class="link" id="openApp" href="https://cinepisode.com" target="_blank" rel="noopener" data-msg="openAppArrow"></a><button type="button" class="link muted" id="cancelChange" data-msg="cancel" hidden></button></div>
  </section>

  <!-- ÉTATS 2 et 3 : connecté (au repos / détection en cours) -->
  <section class="view" id="viewMain" hidden>
    <div class="hd rise"><a class="logo" href="https://cinepisode.com" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="12" width="4" height="7" rx="2" fill="var(--text3)"/><rect x="10" y="8.5" width="4" height="10.5" rx="2" fill="#888"/><rect x="16.5" y="4" width="4" height="14" rx="2" fill="var(--accent2)"/></svg><span>cin<em>episode</em></span></a>
      <span class="conn" data-title-msg="connectedTitle"><i class="dot ok"></i><span data-msg="connected"></span></span>
      <button type="button" class="icbtn" id="openSettings" data-title-msg="settingsTitle" data-aria-msg="settingsTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.2 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.9 3.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8"/></svg></button></div>

    <div class="sec rise" style="--d:1"><p class="cap"><span data-msg="nowTitle"></span><span id="nowPlatform"></span></p>
      <div class="card">
        <div id="nowLive" hidden>
          <div class="now"><div class="poster" id="nowPoster" aria-hidden="true"></div><div class="now-info">
            <span class="live"><i></i><span data-msg="liveBadge"></span></span><h3 id="nowTitle"></h3><div class="sub" id="nowSub"></div></div></div>
          <div class="bar" id="nowBarBox"><span id="nowBar" style="width:0"></span><i class="mark" id="nowMark"></i></div>
          <div class="meta"><span id="nowPct"></span><span id="nowRule"></span></div>
        </div>
        <div id="nowIdle">
          <div class="idle"><div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></div><div><b data-msg="idleTitle"></b><span data-msg="idleSub"></span></div></div>
        </div>
        <div class="last" id="lastRow"><span class="tone" id="lastTone" aria-hidden="true">•</span><div id="last" aria-live="polite"></div></div>
      </div></div>

    <div class="sec rise" style="--d:2"><p class="cap"><span data-msg="platformsCap"></span><span id="platCount"></span></p>
      <div class="grid" id="platGrid">
      <div class="chipw"><button type="button" class="chip on" data-chip="netflix" aria-pressed="true" title="Netflix"><span class="lg nf" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h3v16H7z" fill="#b1060f"/><path d="M14 4h3v16h-3z" fill="#b1060f"/><path d="M7 4h3l7 16h-3z" fill="#e50914"/></svg></span><span class="st" data-msg="chipActive"></span></button></div>
      <div class="chipw"><button type="button" class="chip off" data-chip="crunchyroll" data-role="chip" data-p="crunchyroll" data-name="Crunchyroll" aria-pressed="false" title="Crunchyroll"><span class="tip" data-role="tip" data-p="crunchyroll"></span><span class="lg cr" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#fff"/><path d="M12 5.2a6.8 6.8 0 1 0 6.6 8.4 4.6 4.6 0 1 1-4.7-5.9A4.6 4.6 0 0 1 12 5.2z" fill="#f47521"/></svg></span><span class="st" data-role="state" data-p="crunchyroll"></span></button></div>
      <div class="chipw"><button type="button" class="chip off" data-chip="prime" data-role="chip" data-p="prime" data-name="Prime Video" aria-pressed="false" title="Prime Video"><span class="tip" data-role="tip" data-p="prime"></span><span class="lg pv" aria-hidden="true"><svg viewBox="0 0 24 24"><text x="12" y="13" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="8.6" fill="#fff" letter-spacing="-.3">prime</text><path d="M4.5 16.2c4.6 2.6 10.3 2.4 15-.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M17.6 14.4l2.4 1.6-2.7 1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="st" data-role="state" data-p="prime"></span></button></div>
      <div class="chipw"><button type="button" class="chip off" data-chip="disneyplus" data-role="chip" data-p="disneyplus" data-name="Disney+" aria-pressed="false" title="Disney+"><span class="tip" data-role="tip" data-p="disneyplus"></span><span class="lg dp" aria-hidden="true"><svg viewBox="0 0 24 24"><text x="11" y="15.2" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="10.5" fill="#fff" letter-spacing="-.6">D</text><path d="M17.5 8.2v5.6M14.7 11h5.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="st" data-role="state" data-p="disneyplus"></span></button><span class="info"><button type="button" class="info-btn" data-role="info" aria-expanded="false" data-aria-msg="liveOnlyInfoLabel">!</button><span class="info-pop" role="tooltip" data-msg="liveOnlyInfo"></span></span></div>
      <div class="chipw"><button type="button" class="chip off" data-chip="appletv" data-role="chip" data-p="appletv" data-name="Apple TV" aria-pressed="false" title="Apple TV"><span class="tip" data-role="tip" data-p="appletv"></span><span class="lg at" aria-hidden="true"><svg viewBox="0 0 24 24"><g transform="translate(5 2.2) scale(.58)"><path fill="#f2f2f4" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></g><text x="12" y="21.6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="6.4" fill="#f2f2f4">tv</text></svg></span><span class="st" data-role="state" data-p="appletv"></span></button><span class="info"><button type="button" class="info-btn" data-role="info" aria-expanded="false" data-aria-msg="liveOnlyInfoLabel">!</button><span class="info-pop" role="tooltip" data-msg="liveOnlyInfo"></span></span></div>
      </div></div>

    <div class="sec rise" style="--d:3"><p class="cap"><span data-msg="importCap"></span></p>
      <div class="acts">
        <button type="button" class="btn" id="importNetflix" data-import="netflix" data-title-msg="importNetflix"><span class="lg sm nf" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h3v16H7z" fill="#b1060f"/><path d="M14 4h3v16h-3z" fill="#b1060f"/><path d="M7 4h3l7 16h-3z" fill="#e50914"/></svg></span>Netflix</button>
        <button type="button" class="btn" data-role="import" data-p="crunchyroll" data-title-msg="importCrunchyroll" hidden><span class="lg sm cr" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#fff"/><path d="M12 5.2a6.8 6.8 0 1 0 6.6 8.4 4.6 4.6 0 1 1-4.7-5.9A4.6 4.6 0 0 1 12 5.2z" fill="#f47521"/></svg></span>Crunchyroll</button>
        <button type="button" class="btn" data-role="import" data-p="prime" data-title-msg="importPrime" hidden><span class="lg sm pv" aria-hidden="true"><svg viewBox="0 0 24 24"><text x="12" y="13" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="8.6" fill="#fff" letter-spacing="-.3">prime</text><path d="M4.5 16.2c4.6 2.6 10.3 2.4 15-.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M17.6 14.4l2.4 1.6-2.7 1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Prime</button>
      </div>
      <div id="importStatus" aria-live="polite"></div>
    </div>

    <div class="sec rise review" id="reviewAsk" style="--d:4" hidden><div class="card">
      <p class="rv-t" data-msg="reviewTitle"></p><p class="rv-s" id="reviewSub"></p>
      <div class="acts"><button type="button" class="btn pri sm" id="reviewYes" data-msg="reviewYes"></button><button type="button" class="btn sm" id="reviewLater" data-msg="reviewLater"></button><button type="button" class="link muted" id="reviewNever" data-msg="reviewNever"></button></div>
    </div></div>

    <div class="ft rise" style="--d:4"><span class="count" id="pending"></span><button type="button" class="link" id="openDetected" data-msg="seeDetected"></button></div>
  </section>

  <!-- VUE SECONDAIRE : réglages -->
  <section class="view" id="viewSettings" hidden>
    <div class="back"><button type="button" class="icbtn" id="closeSettings" data-aria-msg="back" data-title-msg="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><h2 data-msg="settingsTitle"></h2></div>
    <div class="sec"><p class="cap"><span data-msg="accountCap"></span></p><div class="card rows">
      <div class="row"><div><span data-msg="tokenLabel"></span><small id="tokenMask"></small></div><button type="button" class="btn sm" id="changeToken" data-msg="change"></button></div>
      <div class="row"><div><span data-msg="csvRow"></span><small data-msg="csvRowHint"></small></div><label class="btn sm" id="csvLabel" for="csvFile"><span data-msg="choose"></span></label><input type="file" id="csvFile" accept=".csv,text/csv" hidden></div>
    </div></div>
    <div class="sec"><p class="cap"><span data-msg="platformsCap"></span></p><div class="card rows">
        <div class="row"><div class="name"><span class="lg sm nf" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h3v16H7z" fill="#b1060f"/><path d="M14 4h3v16h-3z" fill="#b1060f"/><path d="M7 4h3l7 16h-3z" fill="#e50914"/></svg></span><div>Netflix<small data-msg="platformNetflixAlways"></small></div></div><button type="button" class="sw" role="switch" aria-checked="true" disabled data-aria-msg="platformNetflixAlways"></button></div>
        <div class="row"><div class="name"><span class="lg sm cr" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#fff"/><path d="M12 5.2a6.8 6.8 0 1 0 6.6 8.4 4.6 4.6 0 1 1-4.7-5.9A4.6 4.6 0 0 1 12 5.2z" fill="#f47521"/></svg></span><div>Crunchyroll</div></div><button type="button" class="sw" role="switch" aria-checked="false" data-role="switch" data-p="crunchyroll" aria-label="Crunchyroll"></button></div>
        <div class="row"><div class="name"><span class="lg sm pv" aria-hidden="true"><svg viewBox="0 0 24 24"><text x="12" y="13" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="8.6" fill="#fff" letter-spacing="-.3">prime</text><path d="M4.5 16.2c4.6 2.6 10.3 2.4 15-.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M17.6 14.4l2.4 1.6-2.7 1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div>Prime Video</div></div><button type="button" class="sw" role="switch" aria-checked="false" data-role="switch" data-p="prime" aria-label="Prime Video"></button></div>
        <div class="row"><div class="name"><span class="lg sm dp" aria-hidden="true"><svg viewBox="0 0 24 24"><text x="11" y="15.2" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="10.5" fill="#fff" letter-spacing="-.6">D</text><path d="M17.5 8.2v5.6M14.7 11h5.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></span><div>Disney+<span class="info inline"><button type="button" class="info-btn" data-role="info" aria-expanded="false" data-aria-msg="liveOnlyInfoLabel">!</button><span class="info-pop" role="tooltip" data-msg="liveOnlyInfo"></span></span><small data-msg="liveOnlySmall"></small></div></div><button type="button" class="sw" role="switch" aria-checked="false" data-role="switch" data-p="disneyplus" aria-label="Disney+"></button></div>
        <div class="row"><div class="name"><span class="lg sm at" aria-hidden="true"><svg viewBox="0 0 24 24"><g transform="translate(5 2.2) scale(.58)"><path fill="#f2f2f4" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></g><text x="12" y="21.6" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="6.4" fill="#f2f2f4">tv</text></svg></span><div>Apple TV<span class="info inline"><button type="button" class="info-btn" data-role="info" aria-expanded="false" data-aria-msg="liveOnlyInfoLabel">!</button><span class="info-pop" role="tooltip" data-msg="liveOnlyInfo"></span></span><small data-msg="liveOnlySmall"></small></div></div><button type="button" class="sw" role="switch" aria-checked="false" data-role="switch" data-p="appletv" aria-label="Apple TV"></button></div>
    </div></div>
    <div class="sec"><p class="cap"><span data-msg="rulesCap"></span></p><p class="rules" data-msg="rulesText"></p></div>
    <div class="sec" id="diagBox"><p class="cap"><span data-msg="diagTitle"></span></p><div class="card rows">
      <div class="row"><div data-msg="diagDebug"></div><label class="sw" id="diagSw" aria-checked="false"><input type="checkbox" id="diagDebug" data-aria-msg="diagDebug"></label></div>
      <div class="row"><div data-msg="diagCopyHint"></div><button type="button" class="btn sm" id="diagCopy" data-msg="diagCopy"></button></div>
      <div id="diagStatus" aria-live="polite"></div>
    </div></div>
    <div class="ft"><span id="logoutBox"><button type="button" class="link danger" id="logout" data-msg="logout"></button>
      <span class="confirm" id="logoutConfirm" hidden><span data-msg="logoutConfirm"></span><button type="button" class="btn sm danger" id="logoutYes" data-msg="logoutYes"></button><button type="button" class="link muted" id="logoutNo" data-msg="cancel"></button></span></span>
      <span class="ver" id="version"></span></div>
  </section>
</div>
<script src="lib/platforms.js"></script>
<script src="options.js"></script>
</body>
</html>
