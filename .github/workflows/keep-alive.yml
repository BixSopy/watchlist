name: Keep Supabase Alive

# Insère une ligne par jour dans public.keep_alive (colonnes : id, pinged_at) pour
# garder le projet Supabase actif. curl -fsS fait échouer le job si Supabase répond
# une erreur (avant, les 401 passaient en vert).
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (insertion dans keep_alive)
        env:
          SUPABASE_URL: https://batfulcvvquffgfeppcx.supabase.co
          # Clé publishable (sb_publishable_...) : elle se passe dans l'en-tête apikey,
          # pas en Authorization Bearer (ce n'est pas un JWT).
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_KEY" || { echo "Secret SUPABASE_ANON_KEY manquant"; exit 1; }
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/keep_alive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "Ping OK"
