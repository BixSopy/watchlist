name: Release app de bureau Cinepisode (Windows)

# Se déclenche en poussant un tag "desktop-vX.Y.Z" (ex: git tag desktop-v1.0.0 && git push origin desktop-v1.0.0),
# ou manuellement (Actions -> ce workflow -> Run workflow, en renseignant "version").
# Construit l'installateur Windows (NSIS + MSI) via Tauri, crée une Release GitHub (dépôt privé)
# et y attache latest.json (signé) pour l'auto-update. La distribution publique passe ensuite par
# /api/releases (proxy Vercel), car les assets d'une release privée ne sont pas accessibles sans auth.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 1.0.0), sans le prefixe desktop-v'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Actions épinglées sur un commit (une étiquette déplacée chez un tiers ne peut pas
      # injecter de code dans ce job, qui reçoit la clé de signature des mises à jour).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Determiner le tag de release
        id: tag
        shell: bash
        # Entrées passées par l'environnement (jamais interpolées dans le script) et validées
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="desktop-v$INPUT_VERSION"
          else
            name="$REF_NAME"
          fi
          [[ "$name" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $name"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Construire et publier (Tauri)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'Cinepisode ${{ steps.tag.outputs.name }}'
          releaseBody: 'Installateur Windows (MSI/NSIS) avec mise à jour automatique. · Windows installer (MSI/NSIS) with automatic updates.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
