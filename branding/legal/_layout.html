<!DOCTYPE html>
<html lang="[[lang]]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[[title]] · [[name]]</title>
<meta name="description" content="[[description]]">
<meta name="robots" content="[[robots]]">[[canonical]]
<meta property="og:locale" content="[[ogLocale]]">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="[[colors.themeColor]]">
<link rel="icon" href="[[logo.icon192]]">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -170px,rgba([[gradRgb]],.16),transparent 70%),[[colors.bg]];background-repeat:no-repeat;color:[[colors.text]];font-family:[[fonts.body]];font-size:15px;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 60px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 16px;margin-bottom:34px}
.logo{display:flex;align-items:center;gap:9px;font-family:[[fonts.display]];font-weight:900;font-size:21px;letter-spacing:-.5px;color:#fff;text-decoration:none}
.logo em{color:[[colors.violet]];font-style:normal;background:linear-gradient(100deg,[[colors.violet]],[[colors.violetMid]] 55%,[[colors.violetEnd]]);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo svg{width:22px;height:22px}
.back,.lang{display:inline-flex;align-items:center;white-space:nowrap;height:38px;padding:0 16px;border-radius:999px;font-family:[[fonts.display]];font-size:13.5px;font-weight:600;color:[[colors.text]];text-decoration:none;background:rgba(255,255,255,.04);border:1px solid [[colors.border]]}
.back:hover,.lang:hover{background:rgba(255,255,255,.1);color:#fff}
.nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-family:[[fonts.display]];font-weight:900;font-size:36px;line-height:1.12;letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
.updated{color:[[colors.textMuted]];font-size:13px;margin:0 0 30px}
h2{display:flex;align-items:center;gap:12px;font-family:[[fonts.display]];font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-.02em;color:#fff;margin:42px 0 12px}
h2::before{content:"";flex:none;width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,[[colors.accentGradStart]],[[colors.accentGradMid]] 55%,[[colors.accentGradEnd]])}
p,li{color:[[colors.text]]}
.muted{color:[[colors.textMuted]]}
a{color:[[colors.accent]];text-underline-offset:3px}
ul{padding-left:20px}
li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 6px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid [[colors.border]]}
th{color:[[colors.textMuted]];font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
/* Petits écrans : les cellules se coupent au lieu d'élargir la page */
th,td{overflow-wrap:anywhere}
@media (max-width:420px){table{font-size:13px}th,td{padding:8px 6px}}
.card{background:[[colors.surface]];border:1px solid [[colors.border]];border-radius:22px;padding:18px 22px;margin:14px 0}
.tmdb{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tmdb img{height:14px;width:auto}
footer{margin-top:44px;padding-top:18px;border-top:1px solid [[colors.border]];font-size:12px;color:[[colors.textFaint]];display:flex;gap:16px;flex-wrap:wrap}
footer a{color:[[colors.textMuted]]}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="/">[[logoSvg]]<span class="logo-word">[[wordmark.main]]<em>[[wordmark.accent]]</em></span></a>
    <div class="nav">[[otherLangs]]<a class="back" href="/">[[back]]</a></div>
  </div>
  <h1>[[title]]</h1>
  <p class="updated">[[updatedLabel]] [[updated]]</p>
[[content]]
  <footer>
    <a href="[[privacyHref]]">[[privacyLabel]]</a>
    <a href="[[termsHref]]">[[termsLabel]]</a>
    <a href="mailto:[[contactEmail]]">[[contactLabel]]</a>
    <span>[[name]] · [[footerNote]]</span>
  </footer>
</div>
</body>
</html>
