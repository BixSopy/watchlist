<!DOCTYPE html>
<html lang="[[lang]]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[[title]] · [[name]]</title>
<meta name="description" content="[[description]]">
<meta name="robots" content="[[robots]]">[[canonical]]
<meta property="og:locale" content="[[ogLocale]]">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="[[colors.themeColor]]">
<link rel="icon" href="[[logo.icon192]]">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:[[colors.bg]];color:[[colors.text]];font-family:[[fonts.body]];font-size:15px;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
.logo{display:flex;align-items:center;gap:9px;font-family:[[fonts.display]];font-weight:900;font-size:21px;letter-spacing:-.5px;color:#fff;text-decoration:none}
.logo em{color:[[colors.accent]];font-style:normal}
.logo svg{width:22px;height:22px}
.back{font-size:13px;color:[[colors.textMuted]];text-decoration:none;border:1px solid [[colors.border]];border-radius:10px;padding:7px 12px}
.back:hover{color:#fff}
.nav{display:flex;align-items:center;gap:10px}
.lang{font-size:13px;color:[[colors.textMuted]];text-decoration:none}
.lang:hover{color:#fff}
h1{font-family:[[fonts.display]];font-size:30px;line-height:1.2;letter-spacing:-.4px;margin:0 0 6px}
.updated{color:[[colors.textFaint]];font-size:13px;margin:0 0 30px}
h2{font-family:[[fonts.mono]];font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:[[colors.accent]];margin:34px 0 10px}
p,li{color:[[colors.text]]}
.muted{color:[[colors.textMuted]]}
a{color:[[colors.accent]]}
ul{padding-left:20px}
li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 6px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid [[colors.border]]}
th{color:[[colors.textMuted]];font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card{background:[[colors.surface]];border:1px solid [[colors.border]];border-radius:16px;padding:16px 18px;margin:12px 0}
.tmdb{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tmdb img{height:14px;width:auto}
footer{margin-top:44px;padding-top:18px;border-top:1px solid [[colors.border]];font-size:12px;color:[[colors.textFaint]];display:flex;gap:16px;flex-wrap:wrap}
footer a{color:[[colors.textMuted]]}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="/">[[logoSvg]][[wordmark.main]]<em>[[wordmark.accent]]</em></a>
    <div class="nav">[[otherLangs]]<a class="back" href="/">[[back]]</a></div>
  </div>
  <h1>[[title]]</h1>
  <p class="updated">[[updatedLabel]] [[updated]]</p>
[[content]]
  <footer>
    <a href="[[privacyHref]]">[[privacyLabel]]</a>
    <a href="[[termsHref]]">[[termsLabel]]</a>
    <a href="mailto:[[contactEmail]]">[[contactLabel]]</a>
    <span>[[name]] · [[footerNote]]</span>
  </footer>
</div>
</body>
</html>
