<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>[[title]]</title>
<style>
:root{color-scheme:dark;supported-color-schemes:dark}
body{margin:0;padding:0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
table{border-collapse:collapse}
a{color:[[colors.accent]]}
@media only screen and (max-width:620px){
  .wl-card{padding:28px 22px 26px !important}
  .wl-h1{font-size:22px !important;line-height:30px !important}
  .wl-code{font-size:26px !important;letter-spacing:6px !important}
}
</style>
</head>
<body style="margin:0;padding:0;background-color:[[colors.bg]];" bgcolor="[[colors.bg]]">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader]]&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="[[colors.bg]]" style="background-color:[[colors.bg]];width:100%;">
  <tr>
    <td align="center" style="padding:36px 12px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
        <tr>
          <td style="padding:0 6px 22px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="30" height="30" align="center" valign="middle" bgcolor="[[colors.accent]]" style="width:30px;height:30px;background-color:[[colors.accent]];border-radius:9px;color:[[colors.onAccent]];font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:30px;mso-line-height-rule:exactly;">&#9654;&#65038;</td>
                <td style="padding-left:10px;font-family:[[fonts.display]];font-size:21px;line-height:30px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;mso-line-height-rule:exactly;">[[wordmark.main]]<span style="color:[[colors.accent]];">[[wordmark.accent]]</span></td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="wl-card" bgcolor="[[colors.surface]]" style="background-color:[[colors.surface]];border:1px solid [[colors.border]];border-radius:20px;padding:36px 38px 32px;">
[[content]]
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 18px 0;font-family:[[fonts.body]];font-size:12px;line-height:19px;color:[[colors.textFaint]];">
            Tu reçois cet email suite à une action sur un compte [[name]].<br>
            [[name]] · [[tagline]]<br>
            Une question&nbsp;? <a href="mailto:[[contactEmail]]" style="color:[[colors.textMuted]];text-decoration:underline;">[[contactEmail]]</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
